name: Auto Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history to list tags

      - name: Generate next version tag
        id: generate_tag
        run: |
          # Use the highest version tag in the repo, not `git describe` (the nearest one):
          # several tags can sit on one commit, and describe may pick an older one,
          # which makes the next tag collide with an existing release.
          # The optional "v" prefix is stripped before sorting so v1.6.3 never outranks 1.7.0.
          LATEST_TAG=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v1.6.0"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "Latest tag: ${LATEST_TAG:-none}, next tag: $NEXT_TAG"
          echo "tag=$NEXT_TAG" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.generate_tag.outputs.tag }}
          name: "Release ${{ steps.generate_tag.outputs.tag }}"
          body: "Auto-generated release for the latest commit."
          allowUpdates: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
