<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECS 服务器管理</title>
    <meta name="description" content="阿里云 ECS 流量监控与实例管理控制台。">
    <link id="app-favicon" rel="icon" type="image/png" href="icon.png">
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f6f8;
            --surface: #ffffff;
            --surface-2: #f9fafb;
            --surface-3: #f0f2f5;
            --border: #e3e6eb;
            --border-strong: #cfd4dc;
            --text: #111827;
            --text-2: #414b5a;
            --text-3: #5f6b7c;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --on-primary: #ffffff;
            --link: #4338ca;
            --accent-soft: #eef0ff;
            --green: #067647;
            --green-soft: #e8f8ef;
            --green-dot: #17b26a;
            --amber: #a14a06;
            --amber-soft: #fff6e5;
            --amber-dot: #f79009;
            --red: #b42318;
            --red-soft: #fdf0ef;
            --red-dot: #f04438;
            --red-solid: #d92d20;
            --gray-dot: #98a2b3;
            --focus: rgba(79, 70, 229, .28);
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
            --shadow-lg: 0 16px 40px -12px rgba(16, 24, 40, .25), 0 2px 6px rgba(16, 24, 40, .06);
            --radius: 8px;
            --radius-lg: 12px;
            --sidebar-w: 228px;
            --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg: #0c1018;
                --surface: #131a26;
                --surface-2: #171f2d;
                --surface-3: #1e2738;
                --border: #253042;
                --border-strong: #34425a;
                --text: #e7eaf0;
                --text-2: #c0c7d3;
                --text-3: #929cad;
                --primary: #5b5ff0;
                --primary-hover: #6d71f5;
                --on-primary: #ffffff;
                --link: #a5b4fc;
                --accent-soft: rgba(129, 140, 248, .14);
                --green: #5ad49a;
                --green-soft: rgba(23, 178, 106, .14);
                --green-dot: #2fca7f;
                --amber: #fdb54c;
                --amber-soft: rgba(247, 144, 9, .14);
                --amber-dot: #f79009;
                --red: #fd8a80;
                --red-soft: rgba(240, 68, 56, .15);
                --red-dot: #f04438;
                --red-solid: #e5483c;
                --gray-dot: #6b778a;
                --focus: rgba(129, 140, 248, .35);
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
                --shadow-lg: 0 18px 44px -12px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .35);
            }
        }

        *, *::before, *::after { box-sizing: border-box; }
        [v-cloak] { display: none; }
        html, body { margin: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { font: inherit; color: inherit; }
        button { cursor: pointer; }
        button:disabled { cursor: not-allowed; }
        a { color: var(--link); }
        h1, h2, h3, h4, p { margin: 0; }
        .mono { font-family: var(--mono); font-size: 13px; }
        .muted { color: var(--text-3); }
        .small { font-size: 12px; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .min-w-0 { min-width: 0; }
        .row { display: flex; align-items: center; gap: 8px; }
        .row-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .spacer { flex: 1; }
        .stack > * + * { margin-top: 16px; }
        .stack-sm > * + * { margin-top: 10px; }
        .ico { display: inline-flex; flex-shrink: 0; }
        .ico svg { display: block; }

        /* ---------- buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 36px;
            padding: 0 14px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            background: transparent;
            transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
        }
        .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
        .btn:disabled { opacity: .55; }
        .btn-primary { background: var(--primary); color: var(--on-primary); }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--text); box-shadow: var(--shadow-sm); }
        .btn-secondary:hover:not(:disabled) { background: var(--surface-3); }
        .btn-ghost { color: var(--text-2); }
        .btn-ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
        .btn-danger { background: var(--red-solid); color: #fff; }
        .btn-danger:hover:not(:disabled) { filter: brightness(1.06); }
        .btn-danger-soft { color: var(--red); border-color: var(--border-strong); background: var(--surface); }
        .btn-danger-soft:hover:not(:disabled) { background: var(--red-soft); border-color: transparent; }
        .btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }
        .btn-icon { width: 36px; padding: 0; }
        .btn-sm.btn-icon { width: 30px; }
        .btn-block { width: 100%; }
        .spin { animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .link-btn { border: 0; background: none; padding: 0; color: var(--link); font-size: inherit; }
        .link-btn:hover { text-decoration: underline; }

        /* ---------- inputs ---------- */
        .field > label, .field-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--text-2); }
        .field .hint, .hint { margin-top: 6px; font-size: 12px; color: var(--text-3); line-height: 1.55; }
        .req { color: var(--red); margin-left: 2px; }
        .input, .textarea {
            width: 100%;
            height: 38px;
            padding: 0 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            transition: border-color .15s, box-shadow .15s;
        }
        .textarea { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; font-family: var(--mono); font-size: 13px; }
        .input::placeholder, .textarea::placeholder { color: var(--text-3); opacity: .8; }
        .input:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus); }
        .input:disabled { background: var(--surface-3); color: var(--text-3); }
        .input-search { position: relative; }
        .input-search .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
        .input-search .input { padding-left: 34px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .form-grid .full { grid-column: 1 / -1; }

        /* select */
        .select { position: relative; min-width: 0; }
        .select-trigger {
            width: 100%;
            height: 38px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px 0 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border-strong);
            background: var(--surface);
            text-align: left;
        }
        .select-trigger:focus-visible, .select.open .select-trigger { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus); }
        .select-trigger:disabled { background: var(--surface-3); color: var(--text-3); }
        .select-value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .select-value.placeholder { color: var(--text-3); }
        .select-menu, .menu {
            position: absolute;
            z-index: 60;
            min-width: 100%;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 6px;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow-lg);
        }
        .select-option, .menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 34px;
            padding: 6px 10px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            text-align: left;
            white-space: nowrap;
        }
        .select-option:hover, .menu-item:hover:not(:disabled) { background: var(--surface-3); }
        .select-option.selected { color: var(--link); font-weight: 600; }
        .menu-item:disabled { opacity: .5; }
        .menu-item.danger { color: var(--red); }
        .menu-item.danger:hover { background: var(--red-soft); }
        .menu-sep { height: 1px; margin: 4px 2px; background: var(--border); }
        .menu-anchor { position: relative; }
        .menu { right: 0; min-width: 168px; }
        .pop-enter-active, .pop-leave-active { transition: opacity .12s, transform .12s; }
        .pop-enter-from, .pop-leave-to { opacity: 0; transform: translateY(-4px); }

        /* time picker */
        .time-picker { position: relative; }
        .time-picker__panel { position: absolute; z-index: 60; top: calc(100% + 6px); left: 0; width: 220px; padding: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-lg); }
        .time-picker.drop-up .time-picker__panel { top: auto; bottom: calc(100% + 6px); }
        .time-picker__cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: 200px; }
        .time-picker__col { overflow-y: auto; }
        .time-picker__item { width: 100%; height: 30px; border: 0; border-radius: 6px; background: transparent; font-family: var(--mono); }
        .time-picker__item:hover { background: var(--surface-3); }
        .time-picker__item.active { background: var(--primary); color: var(--on-primary); }
        .time-picker__actions { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

        /* switch */
        .switch { position: relative; display: inline-flex; width: 40px; height: 22px; flex-shrink: 0; }
        .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
        .switch-track { position: absolute; inset: 0; border-radius: 999px; background: var(--border-strong); transition: background .15s; }
        .switch-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
        .switch input:checked + .switch-track { background: var(--primary); }
        .switch input:checked + .switch-track::after { transform: translateX(18px); }
        .switch input:focus-visible + .switch-track { box-shadow: 0 0 0 3px var(--focus); }
        .switch input:disabled + .switch-track { opacity: .5; }

        .toggle-row { display: flex; align-items: flex-start; gap: 16px; padding: 14px 0; }
        .toggle-row + .toggle-row { border-top: 1px solid var(--border); }
        .toggle-row .switch { margin-top: 2px; }
        .toggle-title { font-weight: 600; color: var(--text); }
        .toggle-desc { margin-top: 2px; font-size: 13px; color: var(--text-3); line-height: 1.6; }
        .check-row { display: flex; align-items: center; gap: 8px; }
        .check-row input { width: 16px; height: 16px; accent-color: var(--primary); }

        /* segmented */
        .segmented { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--surface-3); }
        .segmented button { height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500; white-space: nowrap; }
        .segmented button:hover { color: var(--text); }
        .segmented button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
        .segmented .count { margin-left: 4px; color: var(--text-3); font-weight: 400; }

        /* badges & dots */
        .badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-3); color: var(--text-2); }
        .badge-green { background: var(--green-soft); color: var(--green); }
        .badge-amber { background: var(--amber-soft); color: var(--amber); }
        .badge-red { background: var(--red-soft); color: var(--red); }
        .badge-accent { background: var(--accent-soft); color: var(--link); }
        .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--gray-dot); }
        .dot-green { background: var(--green-dot); box-shadow: 0 0 0 3px var(--green-soft); }
        .dot-amber { background: var(--amber-dot); box-shadow: 0 0 0 3px var(--amber-soft); }
        .dot-red { background: var(--red-dot); box-shadow: 0 0 0 3px var(--red-soft); }
        .pulse { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .45; } }

        /* progress */
        .progress { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
        .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--primary); transition: width .3s; }
        .progress.warn > span { background: var(--amber-dot); }
        .progress.danger > span { background: var(--red-dot); }

        /* cards & callouts */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
        .card-pad { padding: 20px; }
        .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 20px 0; }
        .card-title { font-size: 15px; font-weight: 600; }
        .card-desc { margin-top: 4px; font-size: 13px; color: var(--text-3); line-height: 1.6; }
        .card-body { padding: 16px 20px 20px; }
        .callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.6; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
        .callout .ico { margin-top: 2px; }
        .callout-info { background: var(--accent-soft); border-color: transparent; }
        .callout-info .ico { color: var(--link); }
        .callout-warn { background: var(--amber-soft); border-color: transparent; }
        .callout-warn .ico { color: var(--amber); }
        .callout-danger { background: var(--red-soft); border-color: transparent; }
        .callout-danger .ico { color: var(--red); }
        .callout-success { background: var(--green-soft); border-color: transparent; }
        .callout-success .ico { color: var(--green); }
        .callout strong { color: var(--text); }

        /* ---------- shell ---------- */
        .shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }
        .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 18px 12px 14px; border-right: 1px solid var(--border); background: var(--surface); }
        .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
        .brand-logo { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; flex-shrink: 0; }
        .brand-fallback { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; background: var(--primary); color: var(--on-primary); font-weight: 700; }
        .brand-name { font-weight: 650; font-size: 15px; line-height: 1.25; }
        .brand-sub { font-size: 12px; color: var(--text-3); }
        .nav { display: flex; flex-direction: column; gap: 2px; }
        .nav-item { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: 0; border-radius: var(--radius); background: transparent; color: var(--text-2); font-weight: 500; text-align: left; }
        .nav-item:hover { background: var(--surface-3); color: var(--text); }
        .nav-item.active { background: var(--accent-soft); color: var(--link); }
        .nav-item .nav-count { margin-left: auto; font-size: 12px; color: var(--text-3); }
        .nav-item .nav-alert { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--red-dot); }
        .sidebar-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
        .monitor-chip { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius); font-size: 12px; color: var(--text-3); }
        .main { min-width: 0; }
        .main-inner { max-width: 1200px; margin: 0 auto; padding: 28px 32px 120px; }
        .topbar, .tabbar { display: none; }

        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
        .page-title { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
        .page-sub { margin-top: 4px; color: var(--text-3); }
        .page-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .banner { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; background: var(--amber-soft); color: var(--amber); font-size: 13px; }
        .banner strong { color: inherit; }

        /* stats */
        .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
        .stat { padding: 14px 16px; text-align: left; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
        button.stat:hover { border-color: var(--border-strong); }
        button.stat.active { border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus); }
        .stat-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
        .stat-value { margin-top: 4px; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
        .stat-value small { font-size: 13px; font-weight: 500; color: var(--text-3); margin-left: 3px; }

        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
        .toolbar .input-search { flex: 1 1 240px; max-width: 360px; }
        .toolbar .select { width: 210px; }

        /* instance list */
        .inst-list { overflow: visible; }
        .inst-row { display: grid; grid-template-columns: minmax(220px, 1.35fr) minmax(190px, 1fr) minmax(180px, .9fr) auto; gap: 20px; align-items: center; padding: 16px 18px; }
        .inst-row + .inst-row, .inst-wrap + .inst-wrap { border-top: 1px solid var(--border); }
        .inst-wrap.is-busy { opacity: .7; }
        .inst-main { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
        .inst-main .dot { margin-top: 7px; }
        .inst-title { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 15px; font-weight: 600; }
        .inst-sub { margin-top: 3px; font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 0 6px; }
        .inst-sub .sep { opacity: .5; }
        .copyable { border: 0; background: none; padding: 0; font-family: var(--mono); font-size: 12px; color: var(--text-3); }
        .copyable:hover { color: var(--link); text-decoration: underline dotted; }
        .ip-line { display: flex; align-items: center; gap: 4px; }
        .ip-line .mono { font-size: 14px; font-weight: 500; color: var(--text); }
        .inst-meta { margin-top: 3px; font-size: 12px; color: var(--text-3); }
        .traffic-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; margin-bottom: 6px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
        .traffic-head strong { font-size: 14px; color: var(--text); font-weight: 600; }
        .inst-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
        .inst-alerts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 14px 38px; margin-top: -6px; }

        /* accounts */
        .acc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .acc-card { display: flex; flex-direction: column; }
        .acc-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 0; }
        .acc-name { font-size: 16px; font-weight: 600; }
        .acc-meta { margin-top: 3px; font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 0 6px; }
        .acc-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
        .acc-usage-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 13px; color: var(--text-3); }
        .acc-usage-top strong { color: var(--text); font-size: 15px; }
        .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .fact-label { font-size: 12px; color: var(--text-3); }
        .fact-value { margin-top: 2px; font-weight: 600; }
        .acc-foot { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

        /* tables */
        .table { width: 100%; }
        .table-row { display: grid; gap: 14px; align-items: center; padding: 12px 18px; font-size: 13px; }
        .table-row + .table-row { border-top: 1px solid var(--border); }
        .table-head { font-size: 12px; font-weight: 500; color: var(--text-3); background: var(--surface-2); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
        .dns-row { grid-template-columns: 112px 130px minmax(140px, 1fr) minmax(140px, 1fr) minmax(200px, 1.4fr) 64px; }
        .log-row { grid-template-columns: 150px 56px minmax(0, 1fr); align-items: start; }
        .log-msg { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; word-break: break-all; color: var(--text-2); }

        /* provider picker */
        .provider-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 4px; }
        .provider-tile { display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 40px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); text-align: left; font-weight: 500; }
        .provider-tile:hover { background: var(--surface-3); }
        .provider-tile.active { border-color: var(--primary); background: var(--accent-soft); color: var(--link); box-shadow: 0 0 0 1px var(--primary) inset; }
        .provider-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* tabs */
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
        .tab { position: relative; height: 40px; padding: 0 12px; border: 0; background: none; color: var(--text-3); font-weight: 500; white-space: nowrap; }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--text); }
        .tab.active::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--primary); }
        .settings-col { max-width: 760px; }
        .section-gap > * + * { margin-top: 16px; }

        /* empty */
        .empty { padding: 56px 24px; text-align: center; }
        .empty-icon { width: 48px; height: 48px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 12px; background: var(--surface-3); color: var(--text-3); }
        .empty-title { font-size: 15px; font-weight: 600; }
        .empty-text { margin: 6px auto 0; max-width: 420px; color: var(--text-3); font-size: 13px; }
        .empty .btn { margin-top: 18px; }

        /* overlays */
        .overlay { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(10, 14, 22, .5); backdrop-filter: blur(2px); }
        .modal { width: 100%; max-width: 560px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
        .modal-lg { max-width: 720px; }
        .modal-sm { max-width: 440px; }
        .modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 22px 0; }
        .modal-title { font-size: 17px; font-weight: 650; }
        .modal-desc { margin-top: 4px; font-size: 13px; color: var(--text-3); line-height: 1.6; }
        .modal-body { padding: 18px 22px; overflow-y: auto; }
        .modal-foot { display: flex; align-items: center; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border); }
        .modal-section + .modal-section { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border); }
        .modal-section-title { margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--text); }
        .steps { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--text-3); }
        .steps .step { display: flex; align-items: center; gap: 6px; }
        .steps .step-num { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-3); font-weight: 600; }
        .steps .step.active { color: var(--text); font-weight: 500; }
        .steps .step.active .step-num { background: var(--primary); color: var(--on-primary); }
        .steps .step-line { width: 28px; height: 1px; background: var(--border-strong); }
        .kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 16px; font-size: 13px; }
        .kv dt { color: var(--text-3); }
        .kv dd { margin: 0; font-weight: 500; word-break: break-all; }
        .kv-group + .kv-group { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
        .kv-title { margin-bottom: 10px; font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; }
        .cred-line { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); }
        .cred-line + .cred-line { margin-top: 8px; }
        .cred-line span:first-child { width: 72px; flex-shrink: 0; font-size: 12px; color: var(--text-3); }
        .cred-line .mono { flex: 1; min-width: 0; word-break: break-all; font-size: 14px; }

        .modal-enter-active, .modal-leave-active { transition: opacity .15s; }
        .modal-leave-active { pointer-events: none; }
        .modal-enter-active .modal, .modal-leave-active .modal { transition: transform .15s; }
        .modal-enter-from, .modal-leave-to { opacity: 0; }
        .modal-enter-from .modal, .modal-leave-to .modal { transform: translateY(8px) scale(.99); }

        /* save bar */
        .savebar { position: fixed; z-index: 70; bottom: 20px; left: calc(var(--sidebar-w) + (100vw - var(--sidebar-w)) / 2); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg); white-space: nowrap; }
        .savebar-text { display: flex; align-items: center; gap: 8px; margin-right: 8px; color: var(--text-2); }
        .savebar-enter-active, .savebar-leave-active { transition: opacity .15s, transform .15s; }
        .savebar-enter-from, .savebar-leave-to { opacity: 0; transform: translate(-50%, 10px); }

        /* toasts */
        .toasts { position: fixed; z-index: 100; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
        .toast { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg); font-size: 13px; line-height: 1.55; pointer-events: auto; }
        .toast .ico { margin-top: 1px; }
        .toast-success .ico { color: var(--green-dot); }
        .toast-error .ico { color: var(--red-dot); }
        .toast-info .ico { color: var(--link); }
        .toast-enter-active, .toast-leave-active { transition: opacity .2s, transform .2s; }
        .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateX(12px); }

        /* auth screens */
        .auth { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .auth-card { width: 100%; max-width: 400px; padding: 32px 28px; }
        .auth-card .brand-logo, .auth-card .brand-fallback { width: 44px; height: 44px; border-radius: 12px; font-size: 18px; }
        .auth-title { margin-top: 18px; font-size: 20px; font-weight: 650; }
        .auth-sub { margin-top: 6px; color: var(--text-3); font-size: 13px; line-height: 1.6; }
        .boot { min-height: 100vh; display: grid; place-items: center; color: var(--text-3); }

        /* ---------- responsive ---------- */
        @media (max-width: 1100px) {
            .inst-row { grid-template-columns: minmax(200px, 1.2fr) minmax(170px, 1fr) auto; }
            .inst-traffic { grid-column: 1 / 3; grid-row: 2; padding-left: 20px; }
            .acc-grid { grid-template-columns: minmax(0, 1fr); }
            .dns-row { grid-template-columns: 100px 120px minmax(120px, 1fr) minmax(160px, 1.4fr) 64px; }
            .dns-row .dns-reason { display: none; }
        }

        @media (max-width: 860px) {
            .shell { display: block; }
            .sidebar { display: none; }
            .topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
            .tabbar { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
            .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; border: 0; background: none; color: var(--text-3); font-size: 11px; }
            .tabbar button.active { color: var(--link); }
            .main-inner { padding: 20px 16px 140px; }
            .page-head { flex-direction: column; align-items: stretch; }
            .page-actions { justify-content: flex-start; }
            .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .toolbar .input-search { max-width: none; flex-basis: 100%; }
            .toolbar .select { flex: 1 1 100%; width: auto; }
            .toolbar .segmented { display: flex; flex: 1 1 100%; }
            .toolbar .segmented button { flex: 1; padding: 0 6px; }
            .inst-row { grid-template-columns: minmax(0, 1fr) auto; gap: 12px 12px; padding: 14px 16px; }
            .inst-main { grid-column: 1 / -1; }
            .inst-net { grid-column: 1; grid-row: 2; padding-left: 20px; }
            .inst-actions { grid-column: 2; grid-row: 2; align-self: center; }
            .inst-traffic { grid-column: 1 / -1; grid-row: 3; padding-left: 20px; }
            .inst-alerts { padding: 0 16px 14px 36px; }
            .form-grid { grid-template-columns: minmax(0, 1fr); }
            .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .provider-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .card-head { flex-direction: column; gap: 8px; }
            .table-head { display: none; }
            .dns-row, .log-row { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
            .dns-row > *, .log-row > * { grid-column: 1 / -1; }
            .dns-row .dns-action { grid-column: 2; grid-row: 1; }
            .dns-row .dns-reason { display: block; }
            .savebar { left: 50%; bottom: 76px; width: calc(100vw - 24px); }
            .savebar-text { flex: 1; min-width: 0; white-space: normal; font-size: 13px; }
            .modal { max-height: calc(100vh - 24px); }
            .overlay { padding: 12px; align-items: flex-end; }
            .kv { grid-template-columns: 96px minmax(0, 1fr); }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="boot" style="min-height:100vh;display:grid;place-items:center;color:#8a94a6;font-family:sans-serif;">正在加载…</div>
    </div>

    <script type="text/x-template" id="app-template">
        <div class="boot" v-if="booting">
            <span class="ico spin" v-html="icon('loader', 22)"></span>
        </div>

        <div class="auth" v-else-if="criticalError">
            <div class="card auth-card">
                <div class="callout callout-danger">
                    <span class="ico" v-html="icon('alert')"></span>
                    <div>
                        <strong>系统初始化失败</strong>
                        <div class="mono small" style="margin-top:6px" v-html="criticalError"></div>
                    </div>
                </div>
                <button class="btn btn-primary btn-block" style="margin-top:18px" @click="reloadPage">重试</button>
            </div>
        </div>

        <div class="auth" v-else-if="!initialized">
            <form class="card auth-card" @submit.prevent="performSetup">
                <brand-mark :logo="brandLogoUrl"></brand-mark>
                <h1 class="auth-title">欢迎使用 ECS 服务器管理</h1>
                <p class="auth-sub">先设置管理员密码和流量保护规则。这些都可以在「设置」里随时修改。</p>
                <div class="stack" style="margin-top:22px">
                    <div class="field">
                        <label>管理员密码<span class="req">*</span></label>
                        <input v-model="setupData.admin_password" type="password" class="input" autocomplete="new-password" placeholder="至少 6 位">
                    </div>
                    <div class="field">
                        <label>流量用到多少时触发保护</label>
                        <div class="row">
                            <input v-model.number="setupData.traffic_threshold" type="number" min="1" max="100" class="input" style="width:110px">
                            <span class="muted">% 的账号额度</span>
                        </div>
                    </div>
                    <div class="field">
                        <label>触发保护后的停机方式</label>
                        <app-select v-model="setupData.shutdown_mode" :options="shutdownModeOptions"></app-select>
                        <p class="hint">{{ shutdownModeHint(setupData.shutdown_mode) }}</p>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top:22px" :disabled="settingUp || (setupData.admin_password || '').length < 6">
                    <span v-if="settingUp" class="ico spin" v-html="icon('loader')"></span>
                    开始使用
                </button>
            </form>
        </div>

        <div class="auth" v-else-if="!isAdmin">
            <form class="card auth-card" @submit.prevent="performLogin">
                <brand-mark :logo="brandLogoUrl"></brand-mark>
                <h1 class="auth-title">登录 ECS 服务器管理</h1>
                <p class="auth-sub">请输入管理员密码。</p>
                <div class="field" style="margin-top:22px">
                    <input ref="loginInput" v-model="passwordInput" type="password" class="input" autocomplete="current-password" placeholder="管理员密码">
                    <p v-if="loginError" class="hint" style="color:var(--red)">{{ loginError }}</p>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px" :disabled="loggingIn || !passwordInput">
                    <span v-if="loggingIn" class="ico spin" v-html="icon('loader')"></span>
                    登录
                </button>
            </form>
        </div>

        <div class="shell" v-else>
            <aside class="sidebar">
                <div class="brand">
                    <brand-mark :logo="brandLogoUrl" small></brand-mark>
                    <div class="min-w-0">
                        <div class="brand-name truncate">ECS 服务器管理</div>
                        <div class="brand-sub">阿里云流量与实例</div>
                    </div>
                </div>
                <nav class="nav">
                    <button v-for="item in navItems" :key="item.key" class="nav-item" :class="{ active: page === item.key }" @click="goto(item.key)">
                        <span class="ico" v-html="icon(item.icon, 18)"></span>
                        <span>{{ item.label }}</span>
                        <span v-if="item.alert" class="nav-alert" :title="item.alert"></span>
                        <span v-else-if="item.count !== undefined" class="nav-count">{{ item.count }}</span>
                    </button>
                </nav>
                <div class="sidebar-foot">
                    <div class="monitor-chip" :title="lastRunText">
                        <span class="dot" :class="cronWarning ? 'dot-amber' : 'dot-green'"></span>
                        <span>{{ cronWarning ? '自动巡检已中断' : '自动巡检运行中' }}</span>
                    </div>
                    <button class="nav-item" @click="logout">
                        <span class="ico" v-html="icon('logout', 18)"></span>
                        <span>退出登录</span>
                    </button>
                </div>
            </aside>

            <header class="topbar">
                <brand-mark :logo="brandLogoUrl" small></brand-mark>
                <div class="brand-name truncate" style="flex:1">ECS 服务器管理</div>
                <span class="dot" :class="cronWarning ? 'dot-amber' : 'dot-green'" :title="cronWarning ? '自动巡检已中断' : '自动巡检运行中'"></span>
                <button class="btn btn-ghost btn-icon" title="退出登录" @click="logout"><span class="ico" v-html="icon('logout', 18)"></span></button>
            </header>

            <main class="main">
                <div class="main-inner">
                    <div v-if="cronWarning" class="banner">
                        <span class="ico" v-html="icon('alert')"></span>
                        <span><strong>自动巡检超过 3 分钟没有运行</strong>，流量保护和失效清理都不会执行。Docker 部署请重启容器；其他部署请确认 crontab 中有 <span class="mono">* * * * * php monitor.php</span>。</span>
                    </div>

                    <!-- ================= 实例 ================= -->
                    <section v-if="page === 'instances'">
                        <div class="page-head">
                            <div>
                                <h1 class="page-title">实例</h1>
                                <p class="page-sub">{{ instancesSubtitle }}</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-secondary" :disabled="syncing || !hasAccounts" @click="syncAll" title="从阿里云重新拉取实例清单、状态和流量">
                                    <span class="ico" :class="{ spin: syncing }" v-html="icon('refresh')"></span>
                                    {{ syncing ? '同步中…' : '同步' }}
                                </button>
                                <button class="btn btn-primary" :disabled="!hasAccounts" @click="openCreateEcs">
                                    <span class="ico" v-html="icon('plus')"></span>创建实例
                                </button>
                            </div>
                        </div>

                        <div v-if="!configLoaded" class="card empty"><span class="ico spin" v-html="icon('loader', 20)"></span></div>
                        <template v-else-if="!hasAccounts">
                            <div class="card empty">
                                <div class="empty-icon"><span class="ico" v-html="icon('key', 22)"></span></div>
                                <div class="empty-title">先添加一个阿里云账号</div>
                                <p class="empty-text">添加 AccessKey 后，系统会自动同步该账号在所选区域的全部实例，并开始监控流量。</p>
                                <button class="btn btn-primary" @click="goto('accounts'); openAccountModal()">
                                    <span class="ico" v-html="icon('plus')"></span>添加账号
                                </button>
                            </div>
                        </template>

                        <template v-else>
                            <div class="stats">
                                <button class="stat" :class="{ active: instFilter.status === 'Running' }" @click="toggleStatusFilter('Running')">
                                    <div class="stat-label"><span class="dot dot-green"></span>运行中</div>
                                    <div class="stat-value">{{ stats.running }}<small>台</small></div>
                                </button>
                                <button class="stat" :class="{ active: instFilter.status === 'Stopped' }" @click="toggleStatusFilter('Stopped')">
                                    <div class="stat-label"><span class="dot"></span>已停止</div>
                                    <div class="stat-value">{{ stats.stopped }}<small>台</small></div>
                                </button>
                                <button class="stat" :class="{ active: instFilter.status === 'attention' }" @click="toggleStatusFilter('attention')">
                                    <div class="stat-label"><span class="dot" :class="stats.attention ? 'dot-red' : ''"></span>需要关注</div>
                                    <div class="stat-value">{{ stats.attention }}<small>台</small></div>
                                </button>
                                <div class="stat">
                                    <div class="stat-label"><span class="ico" v-html="icon('arrowUp', 13)"></span>本月出口流量</div>
                                    <div class="stat-value">{{ formatTrafficValue(stats.traffic) }}</div>
                                </div>
                            </div>

                            <div v-if="rotationStatus && rotationStatus.enabled" class="callout callout-info" style="margin-bottom:12px">
                                <span class="ico" v-html="icon('repeat')"></span>
                                <div>
                                    <strong>账号池轮换已开启</strong>：当前使用 {{ rotationStatus.active_label || '未设置' }}（第 {{ rotationStatus.active_index + 1 }} / {{ rotationStatus.pool_size }} 个）
                                    <span v-if="rotationStatus.entry_domain"> · 入口域名 <span class="mono">{{ rotationStatus.entry_domain }}</span></span>
                                    <span v-if="rotationStatus.last_switch_str"> · 上次切换 {{ rotationStatus.last_switch_str }}</span>
                                </div>
                            </div>

                            <div class="toolbar">
                                <div class="input-search">
                                    <span class="ico" v-html="icon('search')"></span>
                                    <input v-model="instFilter.q" class="input" placeholder="搜索名称、IP 或实例 ID">
                                </div>
                                <app-select v-model="instFilter.account" :options="[{ value: '', label: '全部账号' }, ...accountOptions]"></app-select>
                                <div class="segmented">
                                    <button v-for="opt in statusFilterOptions" :key="opt.value" :class="{ active: instFilter.status === opt.value }" @click="instFilter.status = opt.value">
                                        {{ opt.label }}
                                    </button>
                                </div>
                            </div>

                            <div class="card inst-list">
                                <div v-if="statusLoading && instances.length === 0" class="empty">
                                    <span class="ico spin" v-html="icon('loader', 20)"></span>
                                </div>
                                <div v-else-if="filteredInstances.length === 0" class="empty">
                                    <div class="empty-icon"><span class="ico" v-html="icon('server', 22)"></span></div>
                                    <template v-if="instances.length === 0">
                                        <div class="empty-title">账号下还没有实例</div>
                                        <p class="empty-text">可以直接在这里创建，或者在阿里云控制台创建后点「同步」。</p>
                                        <button class="btn btn-primary" @click="openCreateEcs"><span class="ico" v-html="icon('plus')"></span>创建实例</button>
                                    </template>
                                    <template v-else>
                                        <div class="empty-title">没有符合条件的实例</div>
                                        <button class="btn btn-secondary" @click="resetInstFilter">清除筛选</button>
                                    </template>
                                </div>
                                <div v-for="item in filteredInstances" :key="item.id" class="inst-wrap" :class="{ 'is-busy': isBusy(item.id) }">
                                    <div class="inst-row">
                                        <div class="inst-main">
                                            <span class="dot" :class="['dot-' + instanceState(item).tone, { pulse: instanceState(item).pulse }]"></span>
                                            <div class="min-w-0">
                                                <div class="inst-title">
                                                    <span class="truncate" :title="instTitle(item)">{{ instTitle(item) }}</span>
                                                    <span class="badge" :class="'badge-' + instanceState(item).tone">{{ instanceState(item).text }}</span>
                                                </div>
                                                <div class="inst-sub">
                                                    <span>{{ accountName(item) }}</span><span class="sep">·</span>
                                                    <span>{{ item.regionName }}</span>
                                                    <template v-if="item.instanceName">
                                                        <span class="sep">·</span>
                                                        <button class="copyable" title="复制实例 ID" @click="copyText(item.instanceId, '实例 ID')">{{ item.instanceId }}</button>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="inst-net min-w-0">
                                            <div class="ip-line">
                                                <span class="mono" :class="{ muted: !instIp(item) }">{{ instIp(item) || '无公网 IP' }}</span>
                                                <button v-if="instIp(item)" class="btn btn-ghost btn-sm btn-icon" title="复制 IP" @click="copyText(instIp(item), 'IP')">
                                                    <span class="ico" v-html="icon('copy', 14)"></span>
                                                </button>
                                            </div>
                                            <div class="inst-meta truncate" :title="item.osName">{{ instSpec(item) }}</div>
                                        </div>
                                        <div class="inst-traffic min-w-0">
                                            <div class="traffic-head">
                                                <span>本月出口</span>
                                                <template v-if="hasTrafficIssue(item)"><strong style="color:var(--red)">{{ trafficIssueText(item) }}</strong></template>
                                                <template v-else><strong>{{ formatTrafficValue(item.flow_used) }}</strong><span>/ 额度 {{ item.flow_total }} GB</span></template>
                                            </div>
                                            <div class="progress" :class="usageTone(item.percentageOfUse, item.threshold)">
                                                <span :style="{ width: Math.min(item.percentageOfUse || 0, 100) + '%' }"></span>
                                            </div>
                                        </div>
                                        <div class="inst-actions">
                                            <template v-if="!isReleasing(item)">
                                                <button v-if="canStart(item)" class="btn btn-secondary btn-sm" :disabled="isBusy(item.id)" @click="controlInstance(item, 'start')">
                                                    <span class="ico" v-html="icon('play', 14)"></span>启动
                                                </button>
                                                <button v-else-if="item.instanceStatus === 'Running'" class="btn btn-secondary btn-sm" :disabled="isBusy(item.id)" @click="controlInstance(item, 'stop')">
                                                    <span class="ico" v-html="icon('stop', 14)"></span>停止
                                                </button>
                                            </template>
                                            <div class="menu-anchor">
                                                <button class="btn btn-ghost btn-sm btn-icon" title="更多操作" :disabled="isReleasing(item)" @click.stop="toggleMenu('inst-' + item.id)">

                                                </button>
                                                <transition name="pop">
                                                    <div v-if="openMenu === 'inst-' + item.id" class="menu" @click.stop>

                                                        </button>
                                                        <div class="menu-sep"></div>
                                                        <button class="menu-item danger" @click="closeMenu(); releaseInstance(item)"><span class="ico" v-html="icon('trash', 15)"></span>释放实例</button>
                                                    </div>
                                                </transition>
                                            </div>
                                        </div>
                                    </div>
                                    <div v-if="instanceAlerts(item).length" class="inst-alerts">

                                        </span>
                                    </div>
                                </div>
                            </div>
                            <p v-if="lastStatusAt" class="muted small" style="margin-top:10px">数据更新于 {{ lastStatusAt }}，后台每 30 秒自动刷新，不用手动点。</p>
                        </template>
                    </section>

                    <!-- ================= 账号 ================= -->
                    <section v-if="page === 'accounts'">
                        <div class="page-head">
                            <div>
                                <h1 class="page-title">账号</h1>
                                <p class="page-sub">每个账号对应一组 AccessKey + 区域，流量额度和定时开关机按账号设置。</p>
                            </div>
                            <div class="page-actions">
                                <button class="btn btn-primary" @click="openAccountModal()"><span class="ico" v-html="icon('plus')"></span>添加账号</button>
                            </div>
                        </div>

                        <div v-if="!configLoaded" class="card empty"><span class="ico spin" v-html="icon('loader', 20)"></span></div>
                        <div v-else-if="savedConfig.Accounts.length === 0" class="card empty">
                            <div class="empty-icon"><span class="ico" v-html="icon('key', 22)"></span></div>
                            <div class="empty-title">还没有账号</div>
                            <p class="empty-text">需要一个拥有 ECS 和云监控权限的 RAM 用户 AccessKey。添加后会立即同步实例。</p>
                            <button class="btn btn-primary" @click="openAccountModal()"><span class="ico" v-html="icon('plus')"></span>添加账号</button>
                        </div>

                        <div v-else class="acc-grid">
                            <article v-for="(acc, idx) in savedConfig.Accounts" :key="acc.groupKey || idx" class="card acc-card">
                                <div class="acc-head">
                                    <div class="min-w-0" style="flex:1">
                                        <div class="acc-name truncate">{{ acc.remark || maskAccessKey(acc.AccessKeyId) }}</div>
                                        <div class="acc-meta">
                                            <span>{{ getRegionName(acc.regionId) }}</span><span class="sep">·</span>
                                            <span>{{ getSiteTypeLabel(acc.siteType) }}</span><span class="sep">·</span>
                                            <span class="mono small">{{ maskAccessKey(acc.AccessKeyId) }}</span>
                                        </div>
                                    </div>
                                    <span v-if="hasTrafficIssue(acc)" class="badge badge-red">{{ trafficIssueText(acc) }}</span>
                                    <span v-else-if="(acc.usagePercent || 0) >= savedConfig.traffic_threshold" class="badge badge-red">已达保护线</span>
                                </div>
                                <div class="acc-body">
                                    <div>
                                        <div class="acc-usage-top">
                                            <span>本月出口流量</span>
                                            <span><strong>{{ formatTrafficValue(acc.usageUsed) }}</strong> / {{ acc.maxTraffic }} GB · {{ Number(acc.usagePercent || 0).toFixed(1) }}%</span>
                                        </div>
                                        <div class="progress" :class="usageTone(acc.usagePercent, savedConfig.traffic_threshold)">
                                            <span :style="{ width: Math.min(acc.usagePercent || 0, 100) + '%' }"></span>
                                        </div>
                                    </div>
                                    <div class="facts">
                                        <div>
                                            <div class="fact-label">实例</div>
                                            <div class="fact-value">{{ acc.instanceCount || 0 }} 台</div>
                                        </div>
                                        <template v-if="acc.billing && acc.billing.enabled && !acc.billing.error">
                                            <div>
                                                <div class="fact-label">本月消费</div>
                                                <div class="fact-value">{{ formatCurrencyValue(acc.billing.monthly_cost, acc.billing.currency) }}</div>
                                            </div>
                                            <div>
                                                <div class="fact-label">账户余额</div>
                                                <div class="fact-value">{{ formatCurrencyValue(acc.billing.balance, acc.billing.currency) }}</div>
                                            </div>
                                        </template>
                                        <div v-else style="grid-column: span 2">
                                            <div class="fact-label">费用</div>
                                            <div class="fact-value" style="font-weight:400" :style="{ color: acc.billing && acc.billing.error ? 'var(--red)' : 'var(--text-3)' }">
                                                {{ acc.billing && acc.billing.error ? acc.billing.error : '未开启费用查询' }}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row-wrap small">
                                        <span class="ico muted" v-html="icon('clock', 14)"></span>
                                        <span class="muted">{{ scheduleSummary(acc) }}</span>
                                    </div>
                                    <div v-if="acc.scheduleBlockedByTraffic" class="callout callout-warn">
                                        <span class="ico" v-html="icon('pause')"></span>
                                        <div style="flex:1">本月流量触发过保护，定时开关机已暂停，下月 1 号自动恢复。</div>
                                        <button class="btn btn-secondary btn-sm" :disabled="isRestoringSchedule(acc)" @click="restoreScheduleBlock(acc)">立即恢复</button>
                                    </div>
                                    <div v-if="accountSyncResult(acc)" class="small" :style="{ color: accountSyncResult(acc).success ? 'var(--green)' : 'var(--red)' }">
                                        {{ accountSyncResult(acc).message }}
                                    </div>
                                </div>
                                <div class="acc-foot">
                                    <button class="btn btn-secondary btn-sm" :disabled="isSyncingAccount(acc)" @click="syncAccount(acc)">
                                        <span class="ico" :class="{ spin: isSyncingAccount(acc) }" v-html="icon('refresh', 14)"></span>
                                        {{ isSyncingAccount(acc) ? '同步中…' : '同步' }}
                                    </button>
                                    <button class="btn btn-secondary btn-sm" @click="openAccountModal(idx)">
                                        <span class="ico" v-html="icon('edit', 14)"></span>编辑
                                    </button>
                                    <span class="spacer"></span>
                                    <span v-if="acc.usageLastUpdated" class="muted small">{{ acc.usageLastUpdated.slice(5, 16) }} 更新</span>
                                    <div class="menu-anchor">
                                        <button class="btn btn-ghost btn-sm btn-icon" title="更多操作" @click.stop="toggleMenu('acc-' + idx)">
                                            <span class="ico" v-html="icon('more')"></span>
                                        </button>
                                        <transition name="pop">
                                            <div v-if="openMenu === 'acc-' + idx" class="menu" style="bottom:100%;margin:0 0 6px" @click.stop>
                                                <button class="menu-item danger" @click="closeMenu(); removeAccount(idx)"><span class="ico" v-html="icon('trash', 15)"></span>删除账号</button>
                                            </div>
                                        </transition>
                                    </div>
                                </div>
                            </article>
                        </div>
                    </section>

                    <!-- ================= 域名解析 ================= -->
                    <section v-if="page === 'dns'">
                        <div class="page-head">
                            <div>
                                <h1 class="page-title">域名解析</h1>
                                <p class="page-sub">连接你的 DNS 服务商：实例 IP 变化时自动更新解析，实例失效时自动删除解析。</p>
                            </div>
                        </div>

                        <div class="settings-col section-gap">
                            <div class="card">
                                <div class="card-head">
                                    <div>
                                        <div class="card-title">解析服务商</div>
                                        <div class="card-desc">域名托管在哪家，就选哪家。凭据只保存在本机数据库中。</div>
                                    </div>
                                    <span class="badge" :class="dnsStatus.tone ? 'badge-' + dnsStatus.tone : ''">{{ dnsStatus.text }}</span>
                                </div>
                                <div class="card-body stack">
                                    <div v-for="group in providerGroups" :key="group.key">
                                        <div class="field-label">{{ group.label }}</div>
                                        <div class="provider-grid">
                                            <button v-for="p in group.items" :key="p.id" type="button" class="provider-tile" :class="{ active: draft.Ddns.provider === p.id }" @click="draft.Ddns.provider = p.id">
                                                <span class="provider-name">{{ p.label }}</span>
                                                <span v-if="providerConfigured(p.id)" class="ico" style="color:var(--green-dot)" v-html="icon('checkCircle', 14)" title="已填写凭据"></span>
                                            </button>
                                        </div>
                                    </div>

                                    <div v-if="currentProvider" class="form-grid">
                                        <template v-for="f in currentProvider.fields" :key="f.key">
                                            <div v-if="f.type === 'switch'" class="full toggle-row" style="padding:4px 0">
                                                <div style="flex:1">
                                                    <div class="toggle-title" style="font-weight:500">{{ f.label }}</div>
                                                    <div v-if="f.hint" class="toggle-desc">{{ f.hint }}</div>
                                                </div>
                                                <label class="switch"><input type="checkbox" v-model="draft.Ddns.credentials[currentProvider.id][f.key]"><span class="switch-track"></span></label>
                                            </div>
                                            <div v-else class="field">
                                                <label>{{ f.label }}<span v-if="f.required" class="req">*</span></label>
                                                <app-select v-if="f.type === 'select'" v-model="draft.Ddns.credentials[currentProvider.id][f.key]" :options="f.options"></app-select>
                                                <input v-else v-model.trim="draft.Ddns.credentials[currentProvider.id][f.key]" :type="f.type === 'secret' ? 'password' : 'text'"
                                                    class="input" :class="{ mono: f.type !== 'secret' }" :autocomplete="f.type === 'secret' ? 'new-password' : 'off'" :placeholder="f.placeholder || ''">
                                                <p v-if="f.hint" class="hint">{{ f.hint }}</p>
                                            </div>
                                        </template>
                                        <div class="field">
                                            <label>根域名</label>
                                            <input v-model.trim="draft.Ddns.domain" class="input" placeholder="例如 example.com">
                                            <p class="hint">自动解析需要填写。失效清理只处理这个域名；留空则处理该服务商账号下的全部域名。</p>
                                        </div>
                                        <div v-if="currentProvider.hint" class="full callout">
                                            <span class="ico" v-html="icon('info')"></span>
                                            <div>{{ currentProvider.hint }}</div>
                                        </div>
                                    </div>

                                    <div class="row-wrap">
                                        <button class="btn btn-secondary" :disabled="testingDns" @click="testDns">
                                            <span class="ico" :class="{ spin: testingDns }" v-html="icon(testingDns ? 'loader' : 'plug')"></span>
                                            {{ testingDns ? '测试中…' : '测试连接' }}
                                        </button>
                                        <span class="muted small">用当前填写的内容测试，不需要先保存。</span>
                                    </div>
                                    <div v-if="dnsTestResult" class="callout" :class="dnsTestResult.success ? 'callout-success' : 'callout-danger'">
                                        <span class="ico" v-html="icon(dnsTestResult.success ? 'check' : 'alert')"></span>
                                        <div>
                                            <div>{{ dnsTestResult.message }}</div>
                                            <div v-if="dnsTestResult.success && dnsTestResult.scope" class="small muted" style="margin-top:2px">失效清理范围：{{ dnsTestResult.scope }}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-body" style="padding-top:6px;padding-bottom:6px">
                                    <div class="toggle-row">
                                        <div style="flex:1">
                                            <div class="toggle-title">实例失效时自动删除解析</div>
                                            <div class="toggle-desc">实例到期、被释放或被回收后，把指向它公网 IP 的 A 记录删掉；一条记录里有多个 IP 时只移除这一个。</div>
                                        </div>
                                        <label class="switch"><input type="checkbox" v-model="draft.Ddns.cleanup_enabled"><span class="switch-track"></span></label>
                                    </div>
                                    <div v-if="draft.Ddns.cleanup_enabled" style="padding:0 0 16px 0">
                                        <div class="callout">
                                            <span class="ico" v-html="icon('info')"></span>
                                            <div>
                                                <div><strong>什么时候会触发：</strong>包年包月实例到期；实例从阿里云消失（到期释放、抢占式回收、在控制台删除）；在本系统释放实例；更换 EIP 后的旧 IP。</div>
                                                <div style="margin-top:4px"><strong>防误删：</strong>实例"消失"会按 ID 再确认一次；IP 仍被其他在用实例使用时跳过；失败会自动重试。</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="toggle-row">
                                        <div style="flex:1">
                                            <div class="toggle-title">自动解析（DDNS）</div>
                                            <div class="toggle-desc">创建实例、启动、更换 IP 后，把公网 IP 写到 A 记录。记录名：单台实例用「账号备注.根域名」，同账号多台用「账号备注-实例名.根域名」。需要填写根域名。</div>
                                        </div>
                                        <label class="switch"><input type="checkbox" v-model="draft.Ddns.enabled"><span class="switch-track"></span></label>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-head">
                                    <div>
                                        <div class="card-title">清理记录</div>
                                        <div class="card-desc">最近 50 条。排队中的任务会在下一次自动巡检（约 1 分钟内）处理。</div>
                                    </div>
                                    <button class="btn btn-ghost btn-sm" :disabled="loadingDnsTasks" @click="fetchDnsTasks">
                                        <span class="ico" :class="{ spin: loadingDnsTasks }" v-html="icon('refresh', 14)"></span>刷新
                                    </button>
                                </div>
                                <div style="margin-top:14px">
                                    <div v-if="dnsTasks.length === 0" class="empty" style="padding:32px 20px">
                                        <div class="empty-text" style="margin-top:0">还没有清理记录。实例失效后，处理结果会显示在这里。</div>
                                    </div>
                                    <div v-else class="table">
                                        <div class="table-row table-head dns-row">
                                            <div>时间</div><div>IP</div><div>实例</div><div class="dns-reason">原因</div><div>结果</div><div></div>
                                        </div>
                                        <div v-for="task in dnsTasks" :key="task.id" class="table-row dns-row">
                                            <div class="muted">{{ task.updatedAt.slice(5) }}</div>
                                            <div class="mono">{{ task.ip }}</div>
                                            <div class="truncate" :title="task.label + ' ' + task.instanceId">{{ task.label || task.instanceId || '-' }}</div>
                                            <div class="dns-reason muted small">{{ task.reasonText }}</div>
                                            <div class="min-w-0">
                                                <span class="badge" :class="dnsTaskTone(task.status)">{{ dnsTaskLabel(task) }}</span>
                                                <div v-if="task.message" class="small muted" style="margin-top:3px;word-break:break-all">{{ task.message }}</div>
                                            </div>
                                            <div class="dns-action" style="text-align:right">
                                                <button v-if="task.status !== 'done'" class="btn btn-ghost btn-sm" :disabled="retryingTaskId === task.id" @click="retryDnsTask(task)">
                                                    {{ retryingTaskId === task.id ? '处理中' : '重试' }}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- ================= 设置 ================= -->
                    <section v-if="page === 'settings'">
                        <div class="page-head">
                            <div>
                                <h1 class="page-title">设置</h1>
                            </div>
                        </div>
                        <div class="tabs">
                            <button v-for="tab in settingsTabs" :key="tab.key" class="tab" :class="{ active: settingsTab === tab.key }" @click="settingsTab = tab.key">{{ tab.label }}</button>
                        </div>

                        <div class="settings-col section-gap">
                            <template v-if="settingsTab === 'protection'">
                                <div class="card">
                                    <div class="card-head">
                                        <div>
                                            <div class="card-title">流量保护</div>
                                            <div class="card-desc">按账号统计本月出口流量（每月 1 号清零），达到保护线后执行下面的动作。</div>
                                        </div>
                                    </div>
                                    <div class="card-body form-grid">
                                        <div class="field">
                                            <label>保护线</label>
                                            <div class="row">
                                                <input v-model.number="draft.traffic_threshold" type="number" min="1" max="100" class="input" style="width:100px">
                                                <span class="muted">% 的账号额度</span>
                                            </div>
                                        </div>
                                        <div class="field">
                                            <label>达到保护线时</label>
                                            <app-select v-model="draft.threshold_action" :options="thresholdActionOptions"></app-select>
                                        </div>
                                        <div class="field">
                                            <label>停机方式</label>
                                            <app-select v-model="draft.shutdown_mode" :options="shutdownModeOptions"></app-select>
                                            <p class="hint">{{ shutdownModeHint(draft.shutdown_mode) }}</p>
                                        </div>
                                        <div class="field">
                                            <label>流量和状态的刷新间隔</label>
                                            <app-select v-model="draft.api_interval" :options="intervalOptions"></app-select>
                                            <p class="hint">间隔越短越及时，但调用阿里云接口越频繁。</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="card">
                                    <div class="card-head">
                                        <div class="card-title">自动化</div>
                                    </div>
                                    <div class="card-body" style="padding-top:4px;padding-bottom:4px">
                                        <div class="toggle-row">
                                            <div style="flex:1">
                                                <div class="toggle-title">抢占式实例保活</div>
                                                <div class="toggle-desc">实例被意外停机（例如抢占式实例被回收后重新分配）时自动拉起。你手动停止的实例不会被拉起。</div>
                                            </div>
                                            <label class="switch"><input type="checkbox" v-model="draft.keep_alive"><span class="switch-track"></span></label>
                                        </div>
                                        <div class="toggle-row">
                                            <div style="flex:1">
                                                <div class="toggle-title">每月 1 号自动开机</div>
                                                <div class="toggle-desc">流量额度重置后，把上月因流量保护停掉的实例启动一次。</div>
                                            </div>
                                            <label class="switch"><input type="checkbox" v-model="draft.monthly_auto_start"><span class="switch-track"></span></label>
                                        </div>
                                        <div class="toggle-row">
                                            <div style="flex:1">
                                                <div class="toggle-title">显示费用和余额</div>
                                                <div class="toggle-desc">调用阿里云费用中心查询本月消费和账户余额，需要 bssapi 相关权限。</div>
                                            </div>
                                            <label class="switch"><input type="checkbox" v-model="draft.enable_billing"><span class="switch-track"></span></label>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <template v-if="settingsTab === 'notify'">
                                <div class="card">
                                    <div class="card-head">
                                        <div>
                                            <div class="card-title">通知渠道</div>

                                    </div>
                                    <div class="card-body stack">
                                        <div class="segmented">
                                            <button v-for="ch in notifyChannels" :key="ch.key" :class="{ active: notifyTab === ch.key }" @click="notifyTab = ch.key">

                                            <div class="toggle-row" style="padding-top:4px">

                                            <div class="form-grid">
                                                <div class="field"><label>Bot Token</label><input v-model.trim="draft.Notification.telegram.token" type="password" class="input" autocomplete="new-password" placeholder="123456:ABC…"></div>
                                                <div class="field"><label>Chat ID</label><input v-model.trim="draft.Notification.telegram.chat_id" class="input mono" placeholder="接收消息的会话 ID"></div>
                                                <div class="field"><label>允许遥控的用户 ID</label><input v-model.trim="draft.Notification.telegram.allowed_user_ids" class="input mono" placeholder="可选，多个用逗号分隔"><p class="hint">在群里使用时建议填写，防止其他成员误操作。</p></div>
                                                <div class="field"><label>释放确认有效期（秒）</label><input v-model.number="draft.Notification.telegram.confirm_ttl" type="number" min="30" class="input"></div>

                                <button class="btn btn-danger-soft" :disabled="logs.length === 0" @click="clearLogs">清空</button>
                            </div>
                        </div>

                    <div class="modal-head">

                    </div>
                    <div class="modal-body">
                        <div class="modal-section">
                            <div class="form-grid">
                                <div class="field full">
                                    <label>名称<span class="req">*</span></label>

                                    <label>AccessKey ID<span class="req">*</span></label>

                                    <label>站点</label>

                                    <label>区域<span class="req">*</span></label>

                                        <span class="muted">GB</span>
                                    </div>

                                </div>

                                    {{ accountModal.testing ? '测试中…' : '测试连接' }}
