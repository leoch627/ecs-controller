        const AppSelect = {
            props: {
                modelValue: [String, Number],
                options: { type: Array, default: () => [] },
                placeholder: { type: String, default: '请选择' },
                disabled: { type: Boolean, default: false }
            },
            emits: ['update:modelValue'],
            setup(props, { emit }) {
                const open = ref(false);
                const root = ref(null);
                const id = `select-${Math.random().toString(36).slice(2)}`;
                const selected = computed(() => props.options.find((o) => String(o.value) === String(props.modelValue)) || null);
                const toggle = () => {
                    if (props.disabled) return;
                    if (!open.value) window.dispatchEvent(new CustomEvent('app-popup-open', { detail: { id } }));
                    open.value = !open.value;
                };
                const choose = (option) => { emit('update:modelValue', option.value); open.value = false; };
                const onDocClick = (e) => { if (root.value && !root.value.contains(e.target)) open.value = false; };
                const onKey = (e) => { if (e.key === 'Escape') open.value = false; };
                const onOther = (e) => { if (e.detail?.id !== id) open.value = false; };
                onMounted(() => {
                    document.addEventListener('click', onDocClick);
                    document.addEventListener('keydown', onKey);
                    window.addEventListener('app-popup-open', onOther);
                });
                onUnmounted(() => {
                    document.removeEventListener('click', onDocClick);
                    document.removeEventListener('keydown', onKey);
                    window.removeEventListener('app-popup-open', onOther);
                });
                return { open, root, selected, toggle, choose, icon };
            },
            template: `
                <div ref="root" class="select" :class="{ open }">
                    <button type="button" class="select-trigger" :disabled="disabled" @click.stop="toggle">
                        <span class="select-value" :class="{ placeholder: !selected }">{{ selected ? selected.label : placeholder }}</span>

                        <div v-if="open" class="select-menu">

                                <span style="flex:1">{{ option.label }}</span>
                                <span v-if="String(option.value) === String(modelValue)" class="ico" v-html="icon('check', 14)"></span>
                            </button>
                        </div>

                </div>

        };
        ICON_PATHS.arrowDown = '<path d="m6 9 6 6 6-6"/>';

        const TimePicker = {
            props: {
                modelValue: { type: String, default: '' },
                placeholder: { type: String, default: '选择时间' },
                disabled: { type: Boolean, default: false }
            },
            emits: ['update:modelValue'],
            setup(props, { emit }) {
                const open = ref(false);
                const root = ref(null);
                const dropUp = ref(false);
                const hour = ref('00');
                const minute = ref('00');
                const id = `time-${Math.random().toString(36).slice(2)}`;
                const hours = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
                const minutes = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));
                const sync = () => {
                    const m = String(props.modelValue || '').match(/^(\d{2}):(\d{2})$/);
                    hour.value = m ? m[1] : '08';
                    minute.value = m ? m[2] : '00';
                };
                const toggle = () => {
                    if (props.disabled) return;
                    if (!open.value) {
                        sync();
                        window.dispatchEvent(new CustomEvent('app-popup-open', { detail: { id } }));
                        const rect = root.value.getBoundingClientRect();
                        dropUp.value = (window.innerHeight - rect.bottom) < 300 && rect.top > 300;
                    }
                    open.value = !open.value;
                };
                const confirm = () => { emit('update:modelValue', `${hour.value}:${minute.value}`); open.value = false; };
                const onDocClick = (e) => { if (root.value && !root.value.contains(e.target)) open.value = false; };
                const onOther = (e) => { if (e.detail?.id !== id) open.value = false; };
                watch(() => props.modelValue, sync, { immediate: true });
                onMounted(() => { document.addEventListener('click', onDocClick); window.addEventListener('app-popup-open', onOther); });
                onUnmounted(() => { document.removeEventListener('click', onDocClick); window.removeEventListener('app-popup-open', onOther); });

                                    <button v-for="m in minutes" :key="'m' + m" type="button" class="time-picker__item" :class="{ active: minute === m }" @click="minute = m">{{ m }}</button>
                                </div>
                            </div>
                            <div class="time-picker__actions">
                                <span class="mono muted" style="align-self:center">{{ hour }}:{{ minute }}</span>
                                <button type="button" class="btn btn-primary btn-sm" @click="confirm">确定</button>
                            </div>
                        </div>
                    </transition>
                </div>
            `
        };

        const clone = (value) => JSON.parse(JSON.stringify(value));
        const api = async (action, body = null, query = '') => {
            const options = body === null ? {} : {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: body instanceof FormData ? body : JSON.stringify(body)
            };
            if (body instanceof FormData) delete options.headers;
            const res = await fetch(`index.php?action=${action}${query}`, options);
            let data = {};
            try { data = await res.json(); } catch (e) { data = { success: false, message: '服务器返回了无法解析的内容' }; }
            if (res.status === 403 && (data.error === '请先登录后再操作')) {
                const err = new Error('登录已过期，请重新登录');
                err.authExpired = true;
                throw err;
            }
            return { ok: res.ok, status: res.status, data };
        };

                const shutdownModeHint = (mode) => mode === 'StopCharging'

                const isReleasing = (item) => item.operationLocked || item.instanceStatus === 'Releasing';
                const canStart = (item) => ['Stopped', 'Unknown'].includes(item.instanceStatus);
                const canReplaceIp = (item) => !isReleasing(item) && item.publicIpMode === 'eip' && !!item.eipManaged;
                const isBusy = (id) => busyIds.value.includes(id);
                const setBusy = (id, value) => {

                };
                const daysUntil = (dateStr) => {
                    if (!dateStr) return null;

                const instanceState = (item) => {
                    if (isReleasing(item)) return { text: '释放中', tone: 'amber', pulse: true };

                        case 'Stopped':
                            return { text: item.stoppedMode === 'StopCharging' ? '已停止（节省停机）' : '已停止', tone: 'gray' };

                const instanceAlerts = (item) => {

                    }

                    return alerts;

                const instancesSubtitle = computed(() => {
